[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dea-release-package"
version = "0.1.0"
description = "OpenDEA Release Package Program toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "TechNeHub Labs Architecture Board", email = "architecture@technehub.com"},
]
keywords = ["OpenDEA", "release-engineering", "federation", "catalog", "ECF"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=7.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
bpmn = [
    "lxml>=5.0",
]
excel = [
    "openpyxl>=3.1",
]
pdf = [
    "weasyprint>=60",
    "pypandoc>=1.11",
]
all = [
    "dea-release-package[bpmn,excel,pdf]",
]

[project.urls]
Homepage = "https://github.com/technehub-labs/dea-release-package"
Documentation = "https://github.com/technehub-labs/dea-release-package/blob/main/docs/adr/ADR-DEA-RP-01-program-architecture.md"
Issues = "https://github.com/technehub-labs/dea-release-package/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dea_release_package" = ["py.typed", "*.yaml", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
markers = [
    "integration: marks tests that require network or external services",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true